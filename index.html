<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>W002 Review Quizzes</title>
<meta name="description" content="Daily starter review quizzes for W002. Find today's quiz and show a QR code.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231F3A5F'/%3E%3Ccircle cx='23' cy='9' r='6' fill='%23D9583F'/%3E%3Crect x='6' y='16' width='20' height='3' fill='%23fff'/%3E%3Crect x='6' y='22' width='14' height='3' fill='%23fff'/%3E%3C/svg%3E">
<!-- W002 Review Quizzes. Everything is in this one file: styles, QR maker, questions, hub and quiz.
     The QUESTION BANK starts at the line "QUESTION BANK: UNIT 1". See README.md for how to edit it. -->
<style>
/* W002 Review Quizzes — shared styles.
   Visual system copied from the W002 textbook:
   navy #1F3A5F · coral #D9583F · panel #EEF1F6 · ink #1D2433 · slate #6B7280 · hairline #C9CED6
   Calibri, left-aligned bold titles, coral task labels, square panels, rounded pills. */

:root {
  --navy: #1F3A5F;
  --navy-dark: #172C48;
  --coral: #D9583F;
  --coral-soft: #F4A28F;
  --coral-tint: #FBEAE5;
  --panel: #EEF1F6;
  --ink: #1D2433;
  --slate: #6B7280;
  --hair: #C9CED6;
  --white: #FFFFFF;
  --good: #2E7D5B;
  --good-tint: #E3F2EA;
  --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --gutter: 16px;
}

* { box-sizing: border-box; }
html { font-size: 19px; -webkit-text-size-adjust: 100%; }
@media (max-width: 600px) { html { font-size: 18px; } }
body {
  margin: 0;
  background: var(--white);
  color: var(--ink);
  font-family: var(--font);
  line-height: 1.4;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--coral); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Title band (book: 40pt bold title, left-aligned; tracker top-right) ---------- */
.band {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
  padding: 20px var(--gutter) 14px;
  border-bottom: 1px solid var(--hair);
  max-width: 1100px; margin: 0 auto;
}
.band h1 {
  margin: 0; color: var(--navy); font-weight: 700;
  font-size: clamp(1.6rem, 4.5vw, 2.1rem); line-height: 1.1;
}
.band .sub { margin: 4px 0 0; color: var(--slate); font-size: 0.95rem; }

/* ---------- Module tracker (book: phase labels over number boxes, current = navy fill) ---------- */
.tracker { display: flex; gap: 8px; flex-shrink: 0; }
.tracker .phase { display: flex; flex-direction: column; gap: 3px; }
.tracker .phase-label { font-size: 0.55rem; font-weight: 700; letter-spacing: 0.06em; color: var(--slate); white-space: nowrap; }
.tracker .boxes { display: flex; gap: 2px; }
.tracker .box {
  width: 22px; height: 22px; display: grid; place-items: center;
  border: 1px solid var(--hair); font-size: 0.6rem; font-weight: 700; color: var(--slate); background: var(--white);
}
.tracker .box.on { background: var(--navy); border-color: var(--navy); color: var(--white); }
.tracker-compact { display: none; }
@media (max-width: 760px) {
  .tracker { display: none; }
  .tracker-compact {
    display: inline-block; flex-shrink: 0; background: var(--navy); color: var(--white);
    border-radius: 999px; padding: 4px 12px; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.04em; white-space: nowrap;
  }
}

/* ---------- Shared bits ---------- */
.wrap { max-width: 1100px; margin: 0 auto; padding: 0 var(--gutter); }
.label { color: var(--coral); font-weight: 700; font-size: 1.1rem; margin: 0 0 6px; }
.panel { background: var(--panel); padding: 16px; }
.pill {
  display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 0.75rem; font-weight: 700;
  letter-spacing: 0.04em; background: var(--panel); color: var(--navy); white-space: nowrap;
}
.pill.navy { background: var(--navy); color: var(--white); }
.pill.coral { background: var(--coral); color: var(--white); }
.pill.outline { background: transparent; border: 1px dashed var(--coral); color: var(--coral); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 46px; padding: 8px 18px; border-radius: 999px;
  border: 2px solid var(--navy); background: var(--white); color: var(--navy); font-weight: 700; font-size: 0.95rem;
  text-decoration: none;
}
.btn:hover { background: var(--panel); }
.btn.primary { background: var(--coral); border-color: var(--coral); color: var(--white); }
.btn.primary:hover { background: #C44A33; border-color: #C44A33; }
.btn.navy { background: var(--navy); color: var(--white); }
.btn.navy:hover { background: var(--navy-dark); }
.btn.small { min-height: 38px; padding: 4px 14px; font-size: 0.85rem; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }

.notice-bar { background: var(--coral-tint); border-left: 6px solid var(--coral); padding: 10px 14px; margin: 14px 0; font-size: 0.9rem; }

/* Sticker (book: coral circle, white edge, dashed white inner ring, tilted ~8°) */
.sticker {
  position: relative; width: 150px; height: 150px; border-radius: 50%;
  background: var(--coral); border: 4px solid var(--white); box-shadow: 0 0 0 1px var(--hair);
  transform: rotate(-8deg); display: grid; place-items: center; color: var(--white); text-align: center; flex-shrink: 0;
}
.sticker::after {
  content: ""; position: absolute; inset: 8px; border-radius: 50%; border: 2px dashed rgba(255,255,255,0.9);
}
.sticker .big { font-size: 2.4rem; font-weight: 700; line-height: 1; }
.sticker .small { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.06em; margin-top: 4px; }

/* =====================================================================
   HUB
   ===================================================================== */
.hub-settings { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; margin: 18px 0 6px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.05em; color: var(--slate); text-transform: uppercase; }
.field input, .field select {
  min-height: 44px; padding: 6px 12px; border: 1px solid var(--hair); background: var(--white); border-radius: 0; min-width: 0;
}
.field input[type="text"] { width: 200px; max-width: 100%; }
.hub-help { color: var(--slate); font-size: 0.85rem; max-width: 70ch; margin: 4px 0 0; }

.cycle { margin: 26px 0 8px; }
.cycle-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; border-bottom: 2px solid var(--navy); padding-bottom: 6px; }
.cycle-head h2 { margin: 0; font-size: 1.25rem; color: var(--navy); }
.cycle-head .goal { color: var(--slate); font-size: 0.9rem; }

.days { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
@media (max-width: 1000px) { .days { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .days { grid-template-columns: minmax(0, 1fr); } }

.card {
  background: var(--panel); padding: 14px; display: flex; flex-direction: column; gap: 8px; position: relative;
  border-top: 6px solid var(--navy); min-width: 0;
}
.card.today { border-top-color: var(--coral); box-shadow: 0 0 0 2px var(--coral); }
.card .top { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; }
.card .day { font-weight: 700; color: var(--navy); font-size: 1rem; letter-spacing: 0.04em; }
.card .date { color: var(--slate); font-size: 0.8rem; }
.card h3 { margin: 0; font-size: 1.15rem; color: var(--ink); line-height: 1.2; }
.card .module { color: var(--coral); font-weight: 700; font-size: 0.85rem; }
.card .reviews { font-size: 0.85rem; color: var(--slate); margin: 0; flex-grow: 1; }
.card .actions { display: flex; flex-wrap: wrap; gap: 6px; }
.card .actions .btn.primary { flex: 1 1 100%; }
.card .note { font-size: 0.75rem; color: var(--coral); border: 1px dashed var(--coral); padding: 4px 8px; background: var(--white); }

.footer { color: var(--slate); font-size: 0.8rem; padding: 30px var(--gutter) 40px; max-width: 1100px; margin: 0 auto; }

/* ---------- QR display (book OPENER layout: navy background) ---------- */
.qr-screen {
  position: fixed; inset: 0; background: var(--navy); color: var(--white); z-index: 50;
  display: none; overflow: auto;
}
.qr-screen.open { display: block; }
.qr-inner {
  min-height: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4vw; align-items: center;
  padding: 4vh 5vw;
}
@media (max-width: 800px) { .qr-inner { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: left; } }
.qr-card {
  background: var(--white); padding: 18px; border: 3px dashed var(--coral-soft); outline: 10px solid var(--white);
}
.qr-card canvas { display: block; width: min(62vh, 80vw); height: auto; image-rendering: pixelated; }
.qr-text h2 { font-size: clamp(2rem, 5vw, 3.4rem); margin: 0 0 8px; line-height: 1.05; }
.qr-text .lead { font-size: clamp(1.2rem, 2.6vw, 1.9rem); margin: 0 0 18px; }
.qr-text .meta { font-size: clamp(1rem, 2vw, 1.3rem); margin: 0 0 6px; color: #DCE3EE; }
.qr-text .quizname { color: var(--coral-soft); font-weight: 700; }
.qr-text .code {
  display: inline-block; margin: 12px 0; background: var(--white); color: var(--navy); font-weight: 700;
  border-radius: 999px; padding: 6px 18px; font-size: clamp(1.1rem, 2.4vw, 1.6rem); letter-spacing: 0.08em;
}
.qr-text .late { font-size: clamp(0.95rem, 1.8vw, 1.2rem); color: #DCE3EE; max-width: 34ch; }
.qr-text .link { font-size: 0.75rem; color: #B9C4D6; word-break: break-all; margin-top: 10px; max-width: 60ch; }
.qr-tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.qr-tools .btn { background: transparent; color: var(--white); border-color: rgba(255,255,255,0.7); }
.qr-tools .btn:hover { background: rgba(255,255,255,0.1); }
.qr-tools .btn.primary { background: var(--coral); border-color: var(--coral); }
.timer {
  font-size: clamp(2.2rem, 6vw, 4rem); font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 10px; display: none;
}
.timer.on { display: block; }
.timer.low { color: var(--coral-soft); }

/* =====================================================================
   QUIZ PLAYER
   ===================================================================== */
.quiz-main { max-width: 860px; margin: 0 auto; padding: 18px var(--gutter) 120px; }
.progress { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 18px; }
.dot {
  width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid var(--hair); background: var(--white);
  font-size: 0.75rem; font-weight: 700; color: var(--slate); padding: 0;
}
.dot.done { background: var(--panel); color: var(--navy); border-color: var(--navy); }
.dot.here { background: var(--navy); color: var(--white); border-color: var(--navy); }

.qtitle { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.prompt { font-size: 1.2rem; font-weight: 700; margin: 4px 0 14px; color: var(--ink); }
.context { background: var(--panel); padding: 12px 16px; margin: 0 0 14px; white-space: pre-line; border-left: 6px solid var(--navy); }
.hint { color: var(--slate); font-size: 0.85rem; margin: -6px 0 12px; }

/* multiple choice */
.options { display: grid; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 12px; text-align: left; width: 100%;
  background: var(--white); border: 2px solid var(--hair); padding: 10px 14px; min-height: 54px;
}
.opt .letter {
  width: 32px; height: 32px; flex-shrink: 0; display: grid; place-items: center; background: var(--panel); color: var(--navy); font-weight: 700;
}
.opt:hover { border-color: var(--navy); }
.opt.on { border-color: var(--navy); background: var(--panel); }
.opt.on .letter { background: var(--navy); color: var(--white); }
.options.two { grid-template-columns: 1fr 1fr; }

/* gap fill */
.gaptext { font-size: 1.15rem; line-height: 2.3; background: var(--panel); padding: 12px 16px; }
.gapin {
  border: none; border-bottom: 3px solid var(--navy); background: var(--white); padding: 2px 8px; margin: 0 2px;
  min-width: 5ch; font-weight: 700; color: var(--navy); border-radius: 0; line-height: 1.4;
}
.gapin:focus { outline: none; border-bottom-color: var(--coral); background: var(--coral-tint); }
.bank { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
.bank .bank-label { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.05em; color: var(--slate); }
.bank .pill { font-size: 0.95rem; font-weight: 400; padding: 4px 14px; background: var(--white); border: 1px solid var(--hair); color: var(--ink); }

/* chips (sort / order) */
.chip {
  display: block; width: 100%; text-align: left; background: var(--white); border: 2px solid var(--navy);
  padding: 8px 12px; min-height: 44px; touch-action: none; user-select: none; -webkit-user-select: none;
  border-radius: 8px; font-size: 0.95rem;
}
.chip.sel { border-color: var(--coral); box-shadow: 0 0 0 3px var(--coral-tint); background: var(--coral-tint); }
.chip.ghost { position: fixed; pointer-events: none; z-index: 100; opacity: 0.92; box-shadow: 0 8px 20px rgba(0,0,0,0.2); width: auto; max-width: 80vw; }
.chip.placeholder { opacity: 0.3; }

.pool { display: grid; gap: 8px; padding: 12px; border: 2px dashed var(--hair); min-height: 64px; margin-bottom: 12px; }
.pool:empty::before { content: "All placed. Tap a sentence to move it."; color: var(--slate); font-size: 0.85rem; }
.pool.target { border-color: var(--coral); }
.bins { display: grid; gap: 10px; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); }
@media (max-width: 640px) { .bins { grid-template-columns: minmax(0, 1fr); } }
.bin { background: var(--panel); padding: 10px; min-height: 110px; display: flex; flex-direction: column; gap: 8px; border: 2px solid transparent; text-align: left; }
.bin.target, .bin:hover.armed { border-color: var(--coral); }
.bin-head { font-weight: 700; color: var(--navy); font-size: 0.9rem; letter-spacing: 0.04em; text-transform: uppercase; display: flex; justify-content: space-between; }
.bin-head .n { color: var(--slate); font-weight: 400; }

.slots { display: grid; gap: 8px; margin-bottom: 14px; }
.slot { display: flex; gap: 10px; align-items: stretch; }
.slot .num { width: 34px; flex-shrink: 0; display: grid; place-items: center; background: var(--navy); color: var(--white); font-weight: 700; }
.slot .empty { flex: 1; border: 2px dashed var(--hair); min-height: 44px; }
.slot .chip { flex: 1; }

/* match */
.match-row { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--hair); }
@media (max-width: 640px) { .match-row { grid-template-columns: minmax(0, 1fr); gap: 6px; } }
.match-row .left { font-weight: 700; }
.match-row select { width: 100%; min-height: 48px; border: 2px solid var(--navy); background: var(--white); padding: 6px 10px; border-radius: 0; }
.match-row select.chosen { background: var(--panel); }

/* tap */
.taptext { background: var(--panel); padding: 12px 16px; line-height: 1.9; font-size: 1.1rem; }
.tapseg { background: transparent; border: none; padding: 2px 2px; margin: 0; text-align: left; border-radius: 4px; display: inline; line-height: inherit; }
.tapseg.sentence { border-bottom: 2px dotted var(--hair); }
.tapseg:hover { background: var(--white); }
.tapseg.on { background: var(--coral); color: var(--white); border-bottom-color: var(--coral); }
.tapcount { margin-top: 8px; color: var(--slate); font-size: 0.85rem; }

/* bottom nav */
.navbar {
  position: fixed; left: 0; right: 0; bottom: 0; background: var(--white); border-top: 1px solid var(--hair);
  padding: 10px var(--gutter) calc(10px + env(safe-area-inset-bottom));
}
.navbar .inner { max-width: 860px; margin: 0 auto; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.navbar .count { color: var(--slate); font-size: 0.85rem; text-align: center; }

/* start + results */
.start { display: grid; gap: 18px; max-width: 640px; }
.start .facts { display: flex; gap: 8px; flex-wrap: wrap; }
.start input[type="text"] { min-height: 52px; font-size: 1.1rem; padding: 8px 14px; border: 2px solid var(--navy); width: 100%; border-radius: 0; }

.result-top { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; margin: 10px 0 18px; }
.result-top h2 { margin: 0 0 6px; color: var(--navy); font-size: 1.6rem; }
.slip { background: var(--panel); padding: 12px 16px; border-left: 6px solid var(--coral); font-size: 0.95rem; }
.slip b { color: var(--navy); }

.review { display: grid; gap: 14px; margin-top: 18px; }
.ritem { border: 1px solid var(--hair); padding: 14px; }
.ritem .rhead { display: flex; gap: 10px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
.mark { width: 30px; height: 30px; display: grid; place-items: center; font-weight: 700; color: var(--white); flex-shrink: 0; }
.mark.ok { background: var(--good); }
.mark.part { background: #C98A1B; }
.mark.no { background: var(--coral); }
.ritem .rprompt { font-weight: 700; }
.ritem .explain { margin-top: 8px; background: var(--panel); padding: 8px 12px; font-size: 0.95rem; }
.rlist { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 4px; }
.rlist li { padding: 4px 8px; font-size: 0.95rem; }
.rlist li.right { background: var(--good-tint); }
.rlist li.wrong { background: var(--coral-tint); text-decoration: line-through; text-decoration-color: var(--coral); }
.rlist li.right-but-missed { background: var(--good-tint); border-left: 4px solid var(--good); }
.tag { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.05em; padding: 1px 6px; margin-left: 6px; border-radius: 999px; text-decoration: none; display: inline-block; }
.tag.g { background: var(--good); color: var(--white); }
.tag.c { background: var(--coral); color: var(--white); }
.rtable { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 0.92rem; }
.rtable th, .rtable td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--hair); vertical-align: top; }
.rtable th { font-size: 0.72rem; letter-spacing: 0.05em; color: var(--slate); text-transform: uppercase; }
.rtable td.ok { color: var(--good); font-weight: 700; }
.rtable td.no { color: var(--coral); font-weight: 700; }
.rtext { background: var(--panel); padding: 8px 12px; line-height: 1.8; margin-top: 6px; }
.rtext .hit { background: var(--good-tint); border-bottom: 3px solid var(--good); }
.rtext .miss { background: var(--coral-tint); text-decoration: line-through; text-decoration-color: var(--coral); }
.rtext .found { background: var(--good); color: var(--white); padding: 0 3px; }
.rtext .gapans { font-weight: 700; padding: 0 4px; }
.rtext .gapans.ok { color: var(--good); }
.rtext .gapans.no { color: var(--coral); text-decoration: line-through; }
.rtext .gapfix { color: var(--good); font-weight: 700; }

/* modal */
.modal-bg { position: fixed; inset: 0; background: rgba(29,36,51,0.55); display: none; place-items: center; z-index: 80; padding: var(--gutter); }
.modal-bg.open { display: grid; }
.modal { background: var(--white); max-width: 460px; width: 100%; padding: 20px; border-top: 6px solid var(--coral); }
.modal h3 { margin: 0 0 8px; color: var(--navy); }
.modal .row { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 16px; }

/* answer key (teacher) */
.keyq { border-bottom: 1px solid var(--hair); padding: 14px 0; break-inside: avoid; }
.keyq .ans { background: var(--good-tint); padding: 6px 10px; margin-top: 6px; }
.keyq .ans ol, .keyq .ans ul { margin: 4px 0; padding-left: 22px; }
.teacher-bar { background: var(--navy); color: var(--white); padding: 8px var(--gutter); font-size: 0.85rem; text-align: center; }
.teacher-bar a { color: var(--coral-soft); }

@media print {
  .navbar, .no-print, .teacher-bar { display: none !important; }
  .quiz-main { padding-bottom: 0; }
  body { font-size: 12pt; }
}

/* =====================================================================
   HUB v2 (11 Oct): how-to, unit tabs, module-first cards, results
   ===================================================================== */
.howto { background: var(--panel); border-left: 6px solid var(--coral); padding: 10px 16px; margin: 16px 0 4px; }
.howto summary { font-weight: 700; color: var(--navy); cursor: pointer; font-size: 1.05rem; }
.howto ol { margin: 8px 0 4px; padding-left: 22px; }
.howto li { margin: 4px 0; }

.unit-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 22px 0 0; border-bottom: 2px solid var(--navy); }
.unit-tab {
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left;
  background: var(--panel); border: 1px solid var(--hair); border-bottom: none; padding: 8px 16px; min-height: 52px; max-width: 100%;
}
.unit-tab .ut-title { font-weight: 700; color: var(--navy); font-size: 1.05rem; }
.unit-tab .ut-sub { font-size: 0.78rem; color: var(--slate); }
.unit-tab.on { background: var(--navy); border-color: var(--navy); }
.unit-tab.on .ut-title, .unit-tab.on .ut-sub { color: var(--white); }

.res-screen { position: fixed; inset: 0; background: var(--white); z-index: 60; display: none; }

.res-filters label { display: inline-flex; gap: 6px; align-items: center; min-height: 36px; }
.res-upd { color: var(--slate); font-size: 0.8rem; margin-left: auto; }
.res-body { flex: 1; overflow: auto; }
.res-summary { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 10px; }
.res-scroll { overflow-x: auto; }

<script>
/* ===== Teacher hub ===== */
/* W002 Review Quizzes — teacher hub (one site for all units). */
window.W002.run_hub = function () {
  'use strict';
  var W = window.W002, esc = W.esc;
  var app = document.getElementById('app');
  var unitIds = Object.keys(W.units);
  var RESULTS_URL = (W.CONFIG.resultsURL || '').trim();
  var settings = W.store.get('w002:hub:settings', {}) || {};
  if (!settings.unit || !W.units[settings.unit]) settings.unit = unitIds[0];
  function saveSettings() { W.store.set('w002:hub:settings', settings); }

  var baseURL = new URL(W.PAGE, location.href.split('#')[0].split('?')[0]).href;
  function quizURL(id, section) {
    return baseURL + '?q=' + encodeURIComponent(id) + (section ? '&s=' + encodeURIComponent(section) : '');
  }

  /* ---------------------------------------------------------------- page */
  function render() {
    var unit = W.units[settings.unit];
    var html = '<header class="band"><div><h1>Review Quizzes</h1>' +
      '<p class="sub">W002 Writing Workshop · starter quizzes for every class</p></div>' +
      '<span class="pill navy" style="margin-top:6px">TEACHER HUB</span></header><main class="wrap">';

    if (location.protocol === 'file:') {
      html += '<div class="notice-bar"><b>You opened this file from your computer.</b> The QR codes only work on students’ phones when the hub is online (for example on GitHub Pages).</div>';
    }

    /* How to use: short, always the same place */
    html += '<details class="howto"' + (settings.howtoClosed ? '' : ' open') + ' id="howto"><summary>How to use the quizzes</summary><ol>' +
      '<li>Type your <b>section</b> below. The hub remembers it on this computer.</li>' +
      '<li>Choose the unit. Find the <b>module you are teaching today</b> and press <b>Show QR code</b>.</li>' +
      '<li>Students scan the code with their phone, type their name and do the 10 questions. They see their score and the answers at the end.</li>' +
      (RESULTS_URL ? '<li>Press <b>Results</b> to see your students’ answers while they work or after they finish.</li>' : '') +
      '</ol><p class="hub-help">Want to check a quiz first? Press <b>Preview</b> (nothing is saved) or <b>Answers</b> (a printable answer key).</p></details>';

    html += '<div class="hub-settings">' +
      '<div class="field"><label for="sec">Your section</label><input id="sec" type="text" maxlength="24" placeholder="e.g. Section 12" value="' + esc(settings.section || '') + '"></div>' +
      (RESULTS_URL ? '<div class="field"><label for="pin">Teacher PIN (for results)</label><input id="pin" type="password" inputmode="numeric" maxlength="20" autocomplete="off" value="' + esc(settings.pin || '') + '"></div>' : '') +
      '</div>';

    /* Unit tabs */
    html += '<nav class="unit-tabs" role="tablist" aria-label="Units">' + unitIds.map(function (id) {
      var u = W.units[id], on = id === settings.unit;
      return '<button type="button" role="tab" aria-selected="' + on + '" class="unit-tab' + (on ? ' on' : '') + '" data-unit="' + esc(id) + '">' +
        '<span class="ut-title">' + esc(u.title) + '</span><span class="ut-sub">' + esc(u.subtitle) + '</span></button>';
    }).join('') + '</nav>';

    unit.cycles.forEach(function (cy) {
      var qs = unit.quizzes.filter(function (q) { return q.cycle === cy.n; });
      html += '<section class="cycle"><div class="cycle-head"><h2>' + esc(cy.label) + '</h2><span class="goal">' + esc(cy.goal) + '</span></div><div class="days">';
      qs.forEach(function (q) {
        html += '<article class="card" id="card-' + esc(q.id) + '">' +
          '<div class="top"><span class="modnum">MODULE ' + q.module + '</span><span class="day">' + esc(W.DAY_NAMES[q.day]) + '</span></div>' +
          '<div class="module">' + esc(q.moduleTitle) + '</div>' +
          '<h3>' + esc(q.title) + '</h3>' +
          '<p class="reviews">' + esc(q.reviews) + '</p>' +
          '<div class="actions"><button class="btn primary" type="button" data-qr="' + esc(q.id) + '">Show QR code</button>' +
          (RESULTS_URL ? '<button class="btn navy small wide" type="button" data-res="' + esc(q.id) + '">Results</button>' : '') +

      });

    });

    html += '</main><footer class="footer">Students see their score and the answers only when they finish. ' +
      (RESULTS_URL ? 'Results go to the course Google Sheet. ' : 'Answers are saved on the student’s device only. ') +
      'QR codes are made in your browser (QRCode for JavaScript, © Kazuhiko Arase, MIT licence).</footer>' +
      '<div class="qr-screen" id="qr" role="dialog" aria-modal="true" aria-label="Quiz QR code"></div>' +

    var sec = document.getElementById('sec');

    var pin = document.getElementById('pin');

    });
    app.querySelectorAll('[data-qr]').forEach(function (b) { b.addEventListener('click', function () { openQR(b.getAttribute('data-qr')); }); });
    app.querySelectorAll('[data-res]').forEach(function (b) { b.addEventListener('click', function () { openResults(b.getAttribute('data-res')); }); });
  }

  /* ---------------------------------------------------------------- QR display (shown to students) */
  var timerId = null, lastFocus = null;
  function openQR(id) {
    var f = W.findQuiz(id); if (!f) return;

      '<div class="qr-text"><h2>Starter quiz</h2>' +
      '<p class="lead">Scan the QR code and start the quiz.</p>' +
      '<p class="meta"><span class="quizname">' + esc(q.title) + '</span> · Module ' + q.module + '</p>' +
      (s ? '<p class="meta">' + esc(s) + '</p>' : '') +
      '<div class="timer" id="timer" aria-live="polite"></div>' +
      '<div class="qr-tools">' +
      '<button class="btn primary" type="button" id="t-start">Start 5:00 timer</button>' +
      '<button class="btn" type="button" id="t-full">Full screen</button>' +
      (RESULTS_URL ? '<button class="btn" type="button" id="t-res">Results</button>' : '') +
      '<button class="btn" type="button" id="t-copy">Copy link</button>' +
      '<button class="btn" type="button" id="t-dl">Download QR</button>' +

    W.drawQR(document.getElementById('qrc'), url, { scale: 14 });

    document.getElementById('t-dl').onclick = function () {

    };

      if (document.fullscreenElement) document.exitFullscreen(); else if (el.requestFullscreen) el.requestFullscreen();
    };
    document.getElementById('t-start').onclick = function () { startTimer(300, this); };
    var tr = document.getElementById('t-res');

  }
  function closeQR() {
    var el = document.getElementById('qr');
    if (document.fullscreenElement) document.exitFullscreen();
    el.classList.remove('open'); el.innerHTML = '';
    document.body.style.overflow = '';
    if (timerId) { clearInterval(timerId); timerId = null; }
    if (lastFocus) lastFocus.focus();
  }
  function startTimer(total, btn) {
    var t = document.getElementById('timer'), left = total;
    if (timerId) clearInterval(timerId);
    t.classList.add('on'); t.classList.remove('low');
    btn.textContent = 'Restart timer';
    function show() {
      var m = Math.floor(left / 60), s = left % 60;
      t.textContent = left > 0 ? m + ':' + String(s).padStart(2, '0') : 'Time!';
      t.classList.toggle('low', left <= 60);
    }
    show();
    timerId = setInterval(function () { left--; show(); if (left <= 0) { clearInterval(timerId); timerId = null; } }, 1000);
  }
  function copy(text, btn) {
    function done() { var o = btn.textContent; btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = o; }, 1500); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, function () { window.prompt('Copy this link:', text); });
    else window.prompt('Copy this link:', text);
  }

  /* ---------------------------------------------------------------- results (teacher only) */
  var resTimer = null, resState = null;
  function openResults(id) {
    var f = W.findQuiz(id); if (!f || !RESULTS_URL) return;
    lastFocus = document.activeElement;
    resState = { quiz: f.quiz, when: 'today', mine: !!settings.section, open: {} };
    var el = document.getElementById('res');
    el.classList.add('open'); document.body.style.overflow = 'hidden';
    drawResults(null, 'Loading results ...');
    loadResults();
    resTimer = setInterval(loadResults, 10000);
  }
  function closeResults() {
    var el = document.getElementById('res');
    el.classList.remove('open'); el.innerHTML = '';
    document.body.style.overflow = '';
    if (resTimer) { clearInterval(resTimer); resTimer = null; }
    if (lastFocus) lastFocus.focus();
  }
  function startOfToday() { var d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function loadResults() {
    if (!resState) return;
    if (!settings.pin) { drawResults(null, 'Type the teacher PIN on the hub page, then open Results again.'); return; }
    var u = RESULTS_URL + (RESULTS_URL.indexOf('?') >= 0 ? '&' : '?') + 'action=results' +
      '&quiz=' + encodeURIComponent(resState.quiz.id) + '&pin=' + encodeURIComponent(settings.pin) +
      (resState.when === 'today' ? '&since=' + startOfToday() : '') +
      (resState.mine && settings.section ? '&section=' + encodeURIComponent(settings.section) : '');
    fetch(u).then(function (r) { return r.json(); }).then(function (d) {
      if (!d.ok) drawResults(null, d.error === 'pin' ? 'The teacher PIN is not correct. Check it on the hub page.' : 'The results could not load: ' + (d.error || 'unknown error'));
      else drawResults(d.rows || [], '');
    }).catch(function () { drawResults(null, 'The results could not load. Check the internet connection.'); });
  }
  function drawResults(rows, message) {
    var el = document.getElementById('res'), q = resState.quiz, Q = q.questions;
    var keep = el.querySelector('.res-body'), scroll = keep ? keep.scrollTop : 0;
    var html = '<div class="res-inner"><div class="res-head"><div><p class="label" style="margin:0">Results</p><h2>' + esc(q.title) + '</h2>' +
      '<p class="sub" style="margin:0">Module ' + q.module + (resState.mine && settings.section ? ' · ' + esc(settings.section) : ' · all sections') + '</p></div>' +
      '<button class="btn" type="button" id="r-close">Close</button></div>' +
      '<div class="res-filters">' +
      '<label><input type="radio" name="rw" value="today"' + (resState.when === 'today' ? ' checked' : '') + '> Today</label>' +
      '<label><input type="radio" name="rw" value="all"' + (resState.when === 'all' ? ' checked' : '') + '> All results</label>' +
      (settings.section ? '<label><input type="checkbox" id="r-mine"' + (resState.mine ? ' checked' : '') + '> Only ' + esc(settings.section) + '</label>' : '') +
      '<span class="res-upd">' + (rows ? 'Updated ' + new Date().toLocaleTimeString('en-GB') + ' · updates every 10 seconds' : '') + '</span></div><div class="res-body">';

    if (!rows) html += '<p>' + esc(message) + '</p>';
    else if (!rows.length) html += '<p>No results yet. When students start the quiz, their names appear here.</p>';
    else {
      rows.sort(function (a, b) { return String(a.name).localeCompare(String(b.name)); });
      var done = rows.filter(function (r) { return r.status === 'finished'; });
      var avg = done.length ? (done.reduce(function (s, r) { return s + (+r.score || 0); }, 0) / done.length) : 0;
      html += '<div class="res-summary"><span class="pill navy">' + rows.length + ' started</span><span class="pill">' + done.length + ' finished</span>' +
        (done.length ? '<span class="pill">Average ' + avg.toFixed(1) + ' / 10</span>' : '') + '</div>';
      html += '<div class="res-scroll"><table class="res-table"><thead><tr><th>Name</th><th>Status</th><th>Score</th>';
      Q.forEach(function (_, i) { html += '<th class="qcol">Q' + (i + 1) + '</th>'; });
      html += '</tr></thead><tbody>';
      rows.forEach(function (r) {
        var fin = r.status === 'finished', marks = String(r.marks || '');
        html += '<tr><td><button type="button" class="res-name" data-att="' + esc(r.attempt) + '">' + esc(r.name) + '</button>' + (resState.mine ? '' : '<div class="res-sec">' + esc(r.section || '') + '</div>') + '</td>' +
          '<td>' + (fin ? 'Finished' + (r.seconds ? ' <span class="res-sec">' + Math.round(r.seconds / 60) + ' min</span>' : '') : 'Answering ' + (r.answered || 0) + '/10') + '</td>' +
          '<td><b>' + (fin ? esc(r.score) + '/10' : '') + '</b></td>';
        Q.forEach(function (_, i) {
          var m = marks.charAt(i);
          html += '<td class="qcell ' + (m === '1' ? 'ok' : m === '~' ? 'part' : m === '0' ? 'no' : '') + '">' + (m === '1' ? '✓' : m === '~' ? '~' : m === '0' ? '✗' : '') + '</td>';
        });
        html += '</tr>';
        if (resState.open[r.attempt] && fin && r.answers) {
          var ans = r.answers; if (typeof ans === 'string') { try { ans = JSON.parse(ans); } catch (e) { ans = []; } }
          html += '<tr class="res-detail"><td colspan="' + (3 + Q.length) + '"><ol>' + Q.map(function (qq, i) {
            var m = marks.charAt(i);
            return '<li><b>' + esc(qq.prompt) + '</b><br><span class="' + (m === '1' ? 'ok' : 'no') + '">' + esc(ans[i] || '') + '</span>' +
              (m === '1' ? '' : '<br><span class="res-correct">Correct: ' + esc(W.correctText(qq)) + '</span>') + '</li>';
          }).join('') + '</ol></td></tr>';
        }
      });
      html += '</tbody>';
      if (done.length) {
        html += '<tfoot><tr><td colspan="3">% correct</td>';
        Q.forEach(function (_, i) {
          var ok = done.filter(function (r) { return String(r.marks || '').charAt(i) === '1'; }).length;
          var pc = Math.round(ok / done.length * 100);
          html += '<td class="qcell ' + (pc < 50 ? 'low' : '') + '">' + pc + '</td>';
        });
        html += '</tr></tfoot>';
      }
      html += '</table></div><p class="hub-help">Tap a name to see that student’s answers. In the % correct row, red marks a question that fewer than half of the students got right: a good one to review together.</p>';
    }
    html += '</div></div>';
    el.innerHTML = html;
    var body = el.querySelector('.res-body'); if (body) body.scrollTop = scroll;
    document.getElementById('r-close').onclick = closeResults;
    el.querySelectorAll('input[name="rw"]').forEach(function (r) { r.onchange = function () { resState.when = r.value; loadResults(); }; });
    var mine = document.getElementById('r-mine'); if (mine) mine.onchange = function () { resState.mine = mine.checked; loadResults(); };
    el.querySelectorAll('[data-att]').forEach(function (b) {
      b.onclick = function () { var a = b.getAttribute('data-att'); resState.open[a] = !resState.open[a]; drawResults(rows, message); };
    });
  }

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape' || document.fullscreenElement) return;
    var qr = document.getElementById('qr'), res = document.getElementById('res');
    if (qr && qr.classList.contains('open')) closeQR();
    else if (res && res.classList.contains('open')) closeResults();
  });

  render();
};

/* ===== Quiz player ===== */
/* W002 Review Quizzes — quiz player.
   URL: index.html?q=<quiz id>[&s=<section>][&mode=preview|key]
   No answers are shown until the student finishes. Progress is saved on the device. */
window.W002.run_quiz = function () {
  'use strict';
  var W = window.W002, esc = W.esc;
  var params = new URLSearchParams(location.search);
  var qid = params.get('q') || '';
  var mode = params.get('mode') || 'student';
  var session = { s: (params.get('s') || '').slice(0, 30) };
  var RESULTS_URL = (W.CONFIG && W.CONFIG.resultsURL || '').trim();
  var app = document.getElementById('app');
  var found = W.findQuiz(qid);

  var TYPE_LABEL = { mc: 'Choose', gap: 'Type', sort: 'Sort', order: 'Put in order', match: 'Match', tap: 'Tap' };

  if (!found) {
    document.title = 'Quiz not found · W002';
    app.innerHTML = '<div class="band"><div><h1>Quiz not found</h1><p class="sub">Check the link or scan the QR code again.</p></div></div>' +
      '<main class="quiz-main"><p>This link does not match a quiz.</p><p><a class="btn" href="' + W.PAGE + '">Go to the quiz hub</a></p></main>';
    return;
  }
  var unit = found.unit, quiz = found.quiz, Q = quiz.questions;
  document.title = quiz.title + ' · W002 Review Quiz';

  /* ---------------------------------------------------------------- header */
  function bandHTML() {
    return '<header class="band"><div><h1>' + esc(quiz.title) + '</h1>' +
      '<p class="sub">Starter quiz for Module ' + quiz.module + ': ' + esc(quiz.moduleTitle) + '</p></div>' +
      W.trackerHTML(unit, quiz.module) + '</header>';
  }
  function teacherBar() {
    if (mode === 'preview') return '<div class="teacher-bar">Teacher preview: nothing is saved. <a href="' + W.PAGE + '?q=' + esc(qid) + '&mode=key">Open the answer key</a> · <a href="' + W.PAGE + '">Back to the hub</a></div>';
    if (mode === 'key') return '<div class="teacher-bar">Answer key for teachers · <a href="' + W.PAGE + '?q=' + esc(qid) + '&mode=preview">Try the quiz</a> · <a href="' + W.PAGE + '">Back to the hub</a></div>';
    return '';
  }

  /* ---------------------------------------------------------------- parsing helpers */
  function parseGap(q) {
    var parts = [], gaps = [], re = /\[\[(.+?)\]\]/g, last = 0, m;
    while ((m = re.exec(q.text))) {
      parts.push({ t: q.text.slice(last, m.index) });
      parts.push({ gap: gaps.length });
      gaps.push(m[1].split('|').map(function (s) { return s.trim(); }));
      last = re.lastIndex;
    }
    parts.push({ t: q.text.slice(last) });
    return { parts: parts, gaps: gaps };
  }
  function parseWords(q) {
    var tokens = [], re = /\{([^}]+)\}([^\s{]*)|([^\s{]+)/g, m;
    while ((m = re.exec(q.text))) {
      if (m[1] !== undefined) tokens.push({ w: m[1], after: m[2] || '', target: true });
      else {
        var w = m[3], mm = w.match(/^(.*?)([.,!?;:]*)$/);
        tokens.push({ w: mm[1] || w, after: mm[1] ? mm[2] : '', target: false });
      }
    }
    return tokens;
  }
  function tapTargets(q, view) {
    if (q.mode === 'word') { var t = []; view.tokens.forEach(function (tk, i) { if (tk.target) t.push(i); }); return t; }
    return q.answer.slice();
  }
  function isMulti(q) { return q.type === 'mc' && Array.isArray(q.answer); }
  function needCount(q, view) {
    if (q.type === 'tap') return tapTargets(q, view).length;
    if (isMulti(q)) return q.answer.length;
    return 1;
  }
  function numWord(n) { return ['zero', 'one', 'two', 'three', 'four', 'five', 'six'][n] || String(n); }

  /* ---------------------------------------------------------------- answer key mode */
  if (mode === 'key') { renderKey(); return; }

  /* ---------------------------------------------------------------- state */
  var storeKey = 'w002:' + qid + ':' + (session.s || 'open');
  function fresh() {
    return { name: '', seed: Math.random().toString(36).slice(2) + Date.now().toString(36), answers: [], cur: 0, started: false, finished: false, startedAt: 0, finishedAt: 0 };
  }
  var st = mode === 'preview' ? fresh() : (W.store.get(storeKey, null) || fresh());
  function save() { if (mode !== 'preview') W.store.set(storeKey, st); }

  /* Per-student shuffles (seeded, so a refresh keeps the same order). */
  var views = [];
  function buildViews() {
    var rand = W.rng(st.seed);
    views = Q.map(function (q) {
      var v = {};
      if (q.type === 'mc') {
        var fixed = q.fixed || (q.options.length === 2 && /^true$/i.test(q.options[0]));
        v.order = fixed ? q.options.map(function (_, i) { return i; }) : W.shuffledIndexes(q.options.length, rand);
      } else if (q.type === 'sort' || q.type === 'order') {
        v.order = W.shuffledIndexes(q.items.length, rand);
      } else if (q.type === 'match') {
        v.order = W.shuffledIndexes(q.pairs.length, rand);
      } else if (q.type === 'gap') {
        var g = parseGap(q); v.parts = g.parts; v.gaps = g.gaps;
        if (q.bank) { var bo = W.shuffledIndexes(q.bank.length, rand); v.bank = bo.map(function (k) { return q.bank[k]; }); }
      } else if (q.type === 'tap' && q.mode === 'word') {
        v.tokens = parseWords(q);
      }
      return v;
    });
  }
  buildViews();

  function blank(i) {
    var q = Q[i], v = views[i];
    switch (q.type) {
      case 'mc': return isMulti(q) ? [] : null;
      case 'gap': return v.gaps.map(function () { return ''; });
      case 'sort': return q.items.map(function () { return -1; });
      case 'order': return [];
      case 'match': return q.pairs.map(function () { return -1; });
      case 'tap': return [];
    }
  }
  function ans(i) { if (st.answers[i] === undefined || st.answers[i] === null && isMulti(Q[i])) st.answers[i] = blank(i); return st.answers[i]; }

  function answered(i) {
    var q = Q[i], a = st.answers[i], v = views[i];
    if (a === undefined || a === null) return false;
    switch (q.type) {
      case 'mc': return isMulti(q) ? a.length === q.answer.length : a !== null;
      case 'gap': return a.every(function (x) { return W.norm(x) !== ''; });
      case 'sort': return a.every(function (x) { return x !== -1; });
      case 'order': return a.length === q.items.length;
      case 'match': return a.every(function (x) { return x !== -1; });
      case 'tap': return a.length === needCount(q, v);
    }
    return false;
  }

  /* ---------------------------------------------------------------- grading */
  function grade(i) {
    var q = Q[i], a = st.answers[i], v = views[i], n, ok;
    if (a === undefined || a === null) a = blank(i);
    switch (q.type) {
      case 'mc':
        if (!isMulti(q)) return { score: a === q.answer ? 1 : 0 };
        return setScore(a, q.answer);
      case 'gap':
        n = 0; a.forEach(function (x, gi) { if (gapOK(v.gaps[gi], x)) n++; });
        return { score: n / v.gaps.length };
      case 'sort':
        n = 0; q.items.forEach(function (it, ii) { if (a[ii] === it[1]) n++; });
        return { score: n / q.items.length };
      case 'order':
        n = 0; for (var p = 0; p < q.items.length; p++) if (a[p] === p) n++;
        return { score: n / q.items.length };
      case 'match':
        n = 0; q.pairs.forEach(function (_, pi) { if (a[pi] === pi) n++; });
        return { score: n / q.pairs.length };
      case 'tap':
        return setScore(a, tapTargets(q, v));
    }
    return { score: 0 };
  }
  function setScore(chosen, correct) {
    var hit = 0, wrong = 0;
    chosen.forEach(function (c) { if (correct.indexOf(c) >= 0) hit++; else wrong++; });
    if (hit === correct.length && wrong === 0) return { score: 1 };
    return { score: Math.max(0, (hit - wrong) / correct.length) };
  }
  function gapOK(accepted, typed) {
    var t = W.norm(typed); if (!t) return false;
    return accepted.some(function (x) { return W.norm(x) === t; });
  }

  /* ---------------------------------------------------------------- results for the teacher (optional) */
  /* Sends the student's progress to the Google Apps Script set in W002.CONFIG.resultsURL.
     Nothing is sent in teacher preview, or when no URL is set. */
  function answeredCount() { var n = 0; for (var k = 0; k < Q.length; k++) if (answered(k)) n++; return n; }
  function report(status) {
    if (!RESULTS_URL || mode === 'preview') return;
    var data = {
      attempt: st.seed, unit: unit.id, quiz: qid, section: session.s, name: st.name,
      status: status, answered: answeredCount()
    };
    if (status === 'finished') {
      var full = 0;
      data.marks = Q.map(function (_, i) { var g = grade(i).score; if (g === 1) full++; return g === 1 ? '1' : g > 0 ? '~' : '0'; }).join('');
      data.score = full;
      data.answers = Q.map(function (_, i) { return answerText(i); });
      data.seconds = st.startedAt ? Math.round((st.finishedAt - st.startedAt) / 1000) : '';
    }
    try {
      fetch(RESULTS_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(data), keepalive: true })
        .catch(function () { /* offline: the student still sees their result */ });
    } catch (e) { /* ignore */ }
  }
  var progressTimer = null, lastSent = -1;
  function progressSoon() {
    if (!RESULTS_URL || mode === 'preview' || st.finished) return;
    clearTimeout(progressTimer);
    progressTimer = setTimeout(function () {
      var n = answeredCount();
      if (n !== lastSent) { lastSent = n; report('answering'); }
    }, 2500);
  }
  /* The student's answer as plain text, for the teacher's results sheet. */
  function answerText(i) {
    var q = Q[i], v = views[i], a = st.answers[i];
    if (a === undefined || a === null) a = blank(i);
    var none = '(no answer)';
    switch (q.type) {
      case 'mc': {
        var ch = isMulti(q) ? a : (a === null ? [] : [a]);
        return ch.length ? ch.map(function (k) { return q.options[k]; }).join(' | ') : none;
      }
      case 'gap': return a.some(function (x) { return x.trim(); }) ? a.map(function (x) { return x.trim() || '___'; }).join(' | ') : none;
      case 'sort': return q.items.map(function (it, ii) { return it[0] + ' → ' + (a[ii] >= 0 ? q.bins[a[ii]] : '?'); }).join(' | ');
      case 'order': return a.length ? a.map(function (k) { return q.items[k]; }).join(' → ') : none;
      case 'match': return q.pairs.map(function (p, pi) { return p[0] + ' → ' + (a[pi] >= 0 ? q.pairs[a[pi]][1] : '?'); }).join(' | ');
      case 'tap':
        if (!a.length) return none;
        return a.map(function (k) { return q.mode === 'word' ? v.tokens[k].w : q.sentences[k]; }).join(' | ');
    }
    return '';
  }

  /* ---------------------------------------------------------------- screens */
  function render() {
    if (st.finished) return renderResults();
    if (!st.started) return renderStart();
    renderQuestion();
  }

  function renderStart() {
    var info = [];
    if (session.s) info.push(esc(session.s));
    app.innerHTML = teacherBar() + bandHTML() +
      '<main class="quiz-main"><div class="start">' +
      '<div><p class="label">Starter quiz</p>' +
      '<div class="facts"><span class="pill navy">10 questions</span><span class="pill">About 5 minutes</span><span class="pill">Answers at the end</span></div></div>' +
      '<p>Answer all ten questions. You can go back and change an answer before you finish. You will see your score and the correct answers at the end. ' +
      (mode === 'preview' ? '' : 'Your answers are saved on this phone or tablet, so you can close the page and come back.' + (RESULTS_URL ? ' Your teacher can see your answers.' : '')) + '</p>' +
      (info.length ? '<p class="hint" style="margin:0">' + info.join(' · ') + '</p>' : '') +
      '<div><label class="label" for="nm" style="display:block">Your name</label>' +
      '<input id="nm" type="text" autocomplete="name" maxlength="40" placeholder="First name and family name" value="' + esc(st.name) + '"></div>' +
      '<div><button class="btn primary" id="go" type="button">Start the quiz</button></div>' +
      '</div></main>';
    var nm = document.getElementById('nm'), go = document.getElementById('go');
    function check() { go.disabled = mode !== 'preview' && nm.value.trim().length < 2; }
    nm.addEventListener('input', check); check();
    nm.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !go.disabled) go.click(); });
    go.addEventListener('click', function () {
      st.name = nm.value.trim() || 'Teacher';
      st.started = true; st.startedAt = st.startedAt || Date.now(); st.cur = 0; save(); report('started'); render(); window.scrollTo(0, 0);
    });
  }

  /* --------------------------- question screen */
  var selChip = null;      // sort: item selected by tap
  var suppressClick = false;

  function renderQuestion() {
    var i = st.cur, q = Q[i], v = views[i];
    ans(i);
    var dots = '<nav class="progress" aria-label="Questions">';
    for (var d = 0; d < Q.length; d++) {
      dots += '<button type="button" class="dot' + (d === i ? ' here' : answered(d) ? ' done' : '') + '" data-go="' + d + '" aria-label="Question ' + (d + 1) + (answered(d) ? ', answered' : '') + '">' + (d + 1) + '</button>';
    }
    dots += '</nav>';
    var nDone = 0; for (var k = 0; k < Q.length; k++) if (answered(k)) nDone++;

    app.innerHTML = teacherBar() + bandHTML() +
      '<main class="quiz-main">' + dots +
      '<div class="qtitle"><p class="label">Question ' + (i + 1) + ' of ' + Q.length + '</p><span class="pill">' + TYPE_LABEL[q.type].toUpperCase() + '</span></div>' +
      '<p class="prompt" id="qp">' + esc(q.prompt) + '</p>' +
      (q.context ? '<div class="context">' + esc(q.context) + '</div>' : '') +
      '<div id="qa" role="group" aria-labelledby="qp"></div>' +
      '</main>' +
      '<div class="navbar"><div class="inner">' +
      '<button class="btn" id="back" type="button"' + (i === 0 ? ' disabled' : '') + '>Back</button>' +
      '<span class="count" id="count">' + nDone + ' of ' + Q.length + ' answered</span>' +
      (i === Q.length - 1 ? '<button class="btn primary" id="next" type="button">Finish</button>' : '<button class="btn navy" id="next" type="button">Next</button>') +
      '</div></div><div class="modal-bg" id="modal"></div>';

    var qa = document.getElementById('qa');
    ({ mc: drawMC, gap: drawGap, sort: drawSort, order: drawOrder, match: drawMatch, tap: drawTap })[q.type](qa, i, q, v);

    app.querySelectorAll('[data-go]').forEach(function (b) {
      b.addEventListener('click', function () { go(+b.getAttribute('data-go')); });
    });
    document.getElementById('back').addEventListener('click', function () { go(i - 1); });
    document.getElementById('next').addEventListener('click', function () {
      if (i < Q.length - 1) go(i + 1); else confirmFinish();
    });
  }
  function go(n) {
    if (n < 0 || n >= Q.length) return;
    st.cur = n; selChip = null; save(); renderQuestion(); window.scrollTo(0, 0);
  }
  function changed() {
    save(); progressSoon();
    var nDone = 0; for (var k = 0; k < Q.length; k++) if (answered(k)) nDone++;
    var c = document.getElementById('count'); if (c) c.textContent = nDone + ' of ' + Q.length + ' answered';
    var dot = app.querySelector('[data-go="' + st.cur + '"]'); if (dot) dot.className = 'dot here';
  }

  /* --------------------------- multiple choice */
  function drawMC(el, i, q, v) {
    var multi = isMulti(q), a = ans(i), letters = 'ABCDEFGH';
    var html = multi ? '<p class="hint">Choose ' + numWord(q.answer.length) + ' answers.</p>' : '';
    html += '<div class="options' + (q.options.length === 2 && q.options.every(function (o) { return o.length < 12; }) ? ' two' : '') + '">';
    v.order.forEach(function (oi, pos) {
      var on = multi ? a.indexOf(oi) >= 0 : a === oi;
      html += '<button type="button" class="opt' + (on ? ' on' : '') + '" data-o="' + oi + '" aria-pressed="' + on + '"><span class="letter">' + letters[pos] + '</span><span>' + esc(q.options[oi]) + '</span></button>';
    });
    el.innerHTML = html + '</div>';
    el.querySelectorAll('.opt').forEach(function (b) {
      b.addEventListener('click', function () {
        var oi = +b.getAttribute('data-o');
        if (!multi) st.answers[i] = oi;
        else {
          var arr = ans(i), at = arr.indexOf(oi);
          if (at >= 0) arr.splice(at, 1); else { arr.push(oi); if (arr.length > q.answer.length) arr.shift(); }
        }
        changed(); drawMC(el, i, q, v);
      });
    });
  }

  /* --------------------------- gap fill */
  function drawGap(el, i, q, v) {
    var a = ans(i);
    var html = '<p class="hint">Type your answer' + (v.gaps.length > 1 ? 's' : '') + ' in the box' + (v.gaps.length > 1 ? 'es' : '') + '.</p><div class="gaptext">';
    v.parts.forEach(function (p) {
      if (p.gap === undefined) html += esc(p.t);
      else {
        var w = Math.max(6, Math.max.apply(null, v.gaps[p.gap].map(function (s) { return s.length; })) + 3);
        html += '<input class="gapin" type="text" data-g="' + p.gap + '" value="' + esc(a[p.gap]) + '" style="width:' + w + 'ch" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Gap ' + (p.gap + 1) + '">';
      }
    });
    html += '</div>';
    if (v.bank) html += '<div class="bank"><span class="bank-label">WORDS TO USE</span>' + v.bank.map(function (b) { return '<span class="pill">' + esc(b) + '</span>'; }).join('') + '</div>';
    el.innerHTML = html;
    var ins = el.querySelectorAll('.gapin');
    ins.forEach(function (inp, n) {
      inp.addEventListener('input', function () { a[+inp.getAttribute('data-g')] = inp.value; changed(); });
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); if (ins[n + 1]) ins[n + 1].focus(); else inp.blur(); } });
    });
  }

  /* --------------------------- sort (drag or tap) */
  function drawSort(el, i, q, v) {
    var a = ans(i);
    function chip(ii) {
      return '<button type="button" class="chip' + (selChip === ii ? ' sel' : '') + '" data-i="' + ii + '">' + esc(q.items[ii][0]) + '</button>';
    }
    var pool = v.order.filter(function (ii) { return a[ii] === -1; });
    var html = '<p class="hint">Drag each one into a box. Or tap it, then tap a box.</p>';
    html += '<div class="pool" data-bin="-1" aria-label="Not sorted yet">' + pool.map(chip).join('') + '</div>';
    html += '<div class="bins" style="--cols:' + q.bins.length + '">';
    q.bins.forEach(function (b, bi) {
      var inBin = v.order.filter(function (ii) { return a[ii] === bi; });
      html += '<div class="bin' + (selChip !== null ? ' armed' : '') + '" data-bin="' + bi + '" role="button" tabindex="0" aria-label="Box: ' + esc(b) + '">' +
        '<div class="bin-head"><span>' + esc(b) + '</span><span class="n">' + inBin.length + '</span></div>' + inBin.map(chip).join('') + '</div>';
    });
    el.innerHTML = html + '</div>';

    function place(ii, bi) { a[ii] = bi; selChip = null; changed(); drawSort(el, i, q, v); }

    el.querySelectorAll('[data-bin]').forEach(function (bin) {
      function act(e) {
        if (suppressClick) return;
        if (e.target.closest('.chip') && selChip === null) return;
        if (selChip !== null) { e.stopPropagation(); place(selChip, +bin.getAttribute('data-bin')); }
      }
      bin.addEventListener('click', act);
      bin.addEventListener('keydown', function (e) { if ((e.key === 'Enter' || e.key === ' ') && selChip !== null) { e.preventDefault(); place(selChip, +bin.getAttribute('data-bin')); } });
    });
    el.querySelectorAll('.chip').forEach(function (c) {
      var ii = +c.getAttribute('data-i');
      c.addEventListener('click', function (e) {
        if (suppressClick) { suppressClick = false; return; }
        if (selChip !== null && selChip !== ii && !(a[ii] === -1 && a[selChip] === -1)) return; // let the bin handle it (place selected chip there)
        e.stopPropagation();
        selChip = selChip === ii ? null : ii;
        drawSort(el, i, q, v);
      });
      enableDrag(c, ii, function (bi) { place(ii, bi); });
    });
  }

  function enableDrag(c, ii, onDrop) {
    var sx = 0, sy = 0, dragging = false, ghost = null, over = null, pid = null;
    c.addEventListener('pointerdown', function (e) {
      if (e.button !== undefined && e.button !== 0) return;
      sx = e.clientX; sy = e.clientY; dragging = false; pid = e.pointerId;
      try { c.setPointerCapture(pid); } catch (x) { /* ignore */ }
    });
    c.addEventListener('pointermove', function (e) {
      if (pid === null || e.pointerId !== pid) return;
      var dx = e.clientX - sx, dy = e.clientY - sy;
      if (!dragging && Math.sqrt(dx * dx + dy * dy) > 8) {
        dragging = true;
        var r = c.getBoundingClientRect();
        ghost = c.cloneNode(true); ghost.classList.add('ghost'); ghost.style.width = r.width + 'px';
        document.body.appendChild(ghost); c.classList.add('placeholder');
      }
      if (dragging) {
        e.preventDefault();
        ghost.style.left = (e.clientX - 20) + 'px'; ghost.style.top = (e.clientY - 20) + 'px';
        var under = document.elementFromPoint(e.clientX, e.clientY);
        var t = under && under.closest('[data-bin]');
        if (over && over !== t) over.classList.remove('target');
        over = t; if (t) t.classList.add('target');
        if (e.clientY > window.innerHeight - 60) window.scrollBy(0, 12); else if (e.clientY < 60) window.scrollBy(0, -12);
      }
    });
    function end(e) {
      if (pid === null) return;
      pid = null;
      if (!dragging) return;
      suppressClick = true; setTimeout(function () { suppressClick = false; }, 50);
      if (ghost) ghost.remove(); c.classList.remove('placeholder');
      if (over) over.classList.remove('target');
      var under = document.elementFromPoint(e.clientX, e.clientY);
      var t = under && under.closest('[data-bin]');
      dragging = false;
      if (t) onDrop(+t.getAttribute('data-bin'));
    }
    c.addEventListener('pointerup', end);
    c.addEventListener('pointercancel', function () {
      pid = null; if (ghost) ghost.remove(); c.classList.remove('placeholder'); if (over) over.classList.remove('target'); dragging = false;
    });
  }

  /* --------------------------- order (tap to build) */
  function drawOrder(el, i, q, v) {
    var a = ans(i);
    var html = '<p class="hint">Tap the sentences in the correct order. Tap a numbered sentence to take it back.</p><div class="slots">';
    for (var p = 0; p < q.items.length; p++) {
      html += '<div class="slot"><span class="num">' + (p + 1) + '</span>' +
        (a[p] !== undefined ? '<button type="button" class="chip" data-out="' + p + '">' + esc(q.items[a[p]]) + '</button>' : '<span class="empty"></span>') + '</div>';
    }
    html += '</div><div class="pool" aria-label="Sentences to place">';
    v.order.forEach(function (ii) { if (a.indexOf(ii) < 0) html += '<button type="button" class="chip" data-in="' + ii + '">' + esc(q.items[ii]) + '</button>'; });
    el.innerHTML = html + '</div>';
    el.querySelectorAll('[data-in]').forEach(function (b) {
      b.addEventListener('click', function () { a.push(+b.getAttribute('data-in')); changed(); drawOrder(el, i, q, v); });
    });
    el.querySelectorAll('[data-out]').forEach(function (b) {
      b.addEventListener('click', function () { a.splice(+b.getAttribute('data-out'), 1); changed(); drawOrder(el, i, q, v); });
    });
  }

  /* --------------------------- match */
  function drawMatch(el, i, q, v) {
    var a = ans(i);
    var html = '<p class="hint">Choose the correct answer for each one.</p>';
    q.pairs.forEach(function (pr, pi) {
      html += '<div class="match-row"><div class="left">' + esc(pr[0]) + '</div><select data-p="' + pi + '" class="' + (a[pi] >= 0 ? 'chosen' : '') + '" aria-label="' + esc(pr[0]) + '">' +
        '<option value="-1">Choose ...</option>' +
        v.order.map(function (ri) { return '<option value="' + ri + '"' + (a[pi] === ri ? ' selected' : '') + '>' + esc(q.pairs[ri][1]) + '</option>'; }).join('') +
        '</select></div>';
    });
    el.innerHTML = html;
    el.querySelectorAll('select').forEach(function (s) {
      s.addEventListener('change', function () { a[+s.getAttribute('data-p')] = +s.value; s.className = +s.value >= 0 ? 'chosen' : ''; changed(); });
    });
  }

  /* --------------------------- tap (find the sentence / word) */
  function drawTap(el, i, q, v) {
    var a = ans(i), need = needCount(q, v), what = q.mode === 'word' ? (need > 1 ? 'words' : 'word') : (need > 1 ? 'sentences' : 'sentence');
    var html = '<div class="taptext">';
    if (q.mode === 'word') {
      v.tokens.forEach(function (tk, ti) {
        html += '<button type="button" class="tapseg' + (a.indexOf(ti) >= 0 ? ' on' : '') + '" data-t="' + ti + '" aria-pressed="' + (a.indexOf(ti) >= 0) + '">' + esc(tk.w) + esc(tk.after) + '</button> ';
      });
    } else {
      q.sentences.forEach(function (s, si) {
        html += '<button type="button" class="tapseg sentence' + (a.indexOf(si) >= 0 ? ' on' : '') + '" data-t="' + si + '" aria-pressed="' + (a.indexOf(si) >= 0) + '">' + esc(s) + '</button> ';
      });
    }
    html += '</div><p class="tapcount">Tap ' + numWord(need) + ' ' + what + '. Chosen: ' + a.length + ' of ' + need + '. Tap again to undo.</p>';
    el.innerHTML = html;
    el.querySelectorAll('[data-t]').forEach(function (b) {
      b.addEventListener('click', function () {
        var t = +b.getAttribute('data-t'), at = a.indexOf(t);
        if (at >= 0) a.splice(at, 1); else { a.push(t); if (a.length > need) a.shift(); }
        changed(); drawTap(el, i, q, v);
      });
    });
  }

  /* --------------------------- finish */
  function confirmFinish() {
    var missing = []; for (var k = 0; k < Q.length; k++) if (!answered(k)) missing.push(k + 1);
    var modal = document.getElementById('modal');
    modal.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mh"><h3 id="mh">Finish the quiz?</h3>' +
      (missing.length ? '<p>You have not finished question' + (missing.length > 1 ? 's ' : ' ') + missing.join(', ') + '.</p>' : '<p>You answered all ten questions.</p>') +
      '<p>After you finish, you cannot change your answers.</p>' +
      '<div class="row">' + (missing.length ? '<button class="btn" id="m-go" type="button">Go to question ' + missing[0] + '</button>' : '<button class="btn" id="m-no" type="button">Check again</button>') +
      '<button class="btn primary" id="m-yes" type="button">Finish</button></div></div>';
    modal.classList.add('open');
    document.getElementById('m-yes').focus();
    document.getElementById('m-yes').addEventListener('click', function () {
      st.finished = true; st.finishedAt = Date.now(); save(); modal.classList.remove('open');
      report('finished'); setTimeout(function () { report('finished'); }, 4000);
      render(); window.scrollTo(0, 0);
    });
    var back = document.getElementById('m-go') || document.getElementById('m-no');
    back.addEventListener('click', function () { modal.classList.remove('open'); if (missing.length) go(missing[0] - 1); });
  }

  /* --------------------------- results */
  function renderResults() {
    var full = 0, part = 0, marks = [];
    Q.forEach(function (_, i) { var g = grade(i); marks.push(g.score); if (g.score === 1) full++; else if (g.score > 0) part++; });
    var msg = full === 10 ? 'Excellent!' : full >= 8 ? 'Great work!' : full >= 6 ? 'Good work!' : 'Keep going!';
    var secs = st.startedAt && st.finishedAt ? Math.round((st.finishedAt - st.startedAt) / 1000) : 0;
    var time = secs ? Math.floor(secs / 60) + ' min ' + (secs % 60) + ' s' : '';
    var when = st.finishedAt ? new Date(st.finishedAt).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) : '';

    var html = teacherBar() + bandHTML() + '<main class="quiz-main" style="padding-bottom:40px">' +
      '<div class="result-top"><div class="sticker" aria-hidden="true"><div><div class="big">' + full + '/10</div><div class="small">' + esc(msg.replace('!', '').toUpperCase()) + '</div></div></div>' +
      '<div style="flex:1;min-width:240px"><h2>' + esc(msg) + ' You got ' + full + ' out of 10.</h2>' +
      (part ? '<p style="margin:0 0 10px">' + part + (part > 1 ? ' answers were' : ' answer was') + ' nearly right.</p>' : '') +
      '<div class="slip"><b>' + esc(st.name) + '</b>' +
      (session.s ? ' · ' + esc(session.s) : '') +
      (when ? ' · Finished ' + esc(when) : '') + (time ? ' (' + esc(time) + ')' : '') +
      '<br><span style="color:var(--slate);font-size:0.85rem">' + (RESULTS_URL && mode !== 'preview' ? 'Your teacher can see your result.' : 'Show this screen to your teacher if they ask.') + '</span></div></div></div>' +
      '<p class="label">Check your answers</p><p style="margin-top:0">Read the correct answers. Look carefully at any question with ✗ or ~.</p>' +
      '<div class="review">';
    Q.forEach(function (q, i) {
      var s = marks[i], cls = s === 1 ? 'ok' : s > 0 ? 'part' : 'no', sym = s === 1 ? '✓' : s > 0 ? '~' : '✗';
      html += '<section class="ritem"><div class="rhead"><span class="mark ' + cls + '" aria-label="' + (s === 1 ? 'Correct' : s > 0 ? 'Nearly right' : 'Not correct') + '">' + sym + '</span>' +
        '<span class="label" style="margin:0">Question ' + (i + 1) + '</span></div>' +
        '<div class="rprompt">' + esc(q.prompt) + '</div>' +
        (q.context ? '<div class="context" style="margin:6px 0 0">' + esc(q.context) + '</div>' : '') +
        reviewBody(i) +
        '<div class="explain">' + esc(q.explain) + '</div></section>';
    });
    html += '</div>';
    if (mode === 'preview') html += '<p style="margin-top:20px"><button class="btn navy" id="again" type="button">Try again</button> <a class="btn" href="' + W.PAGE + '">Back to the hub</a></p>';
    html += '</main>';
    app.innerHTML = html;
    var again = document.getElementById('again');
    if (again) again.addEventListener('click', function () { st = fresh(); buildViews(); st.started = true; st.startedAt = Date.now(); st.name = 'Teacher'; render(); window.scrollTo(0, 0); });
  }

  function reviewBody(i) {
    var q = Q[i], v = views[i], a = st.answers[i];
    if (a === undefined || a === null) a = blank(i);
    var h = '';
    switch (q.type) {
      case 'mc': {
        var correct = isMulti(q) ? q.answer : [q.answer], chosen = isMulti(q) ? a : (a === null ? [] : [a]);
        h = '<ul class="rlist">';
        q.options.forEach(function (o, oi) {
          var isC = correct.indexOf(oi) >= 0, isP = chosen.indexOf(oi) >= 0;
          if (!isC && !isP) return;
          h += '<li class="' + (isC ? (isP ? 'right' : 'right-but-missed') : 'wrong') + '">' + esc(o) +
            (isC ? ' <span class="tag g">CORRECT ANSWER</span>' : '') + (isP ? ' <span class="tag ' + (isC ? 'g' : 'c') + '">YOUR ANSWER</span>' : '') + '</li>';
        });
        if (!chosen.length) h += '<li class="wrong" style="text-decoration:none">You did not answer.</li>';
        return h + '</ul>';
      }
      case 'gap':
        h = '<div class="rtext">';
        v.parts.forEach(function (p) {
          if (p.gap === undefined) { h += esc(p.t); return; }
          var typed = a[p.gap] || '', ok = gapOK(v.gaps[p.gap], typed);
          if (ok) h += '<span class="gapans ok">' + esc(typed.trim()) + ' ✓</span>';
          else h += (typed.trim() ? '<span class="gapans no">' + esc(typed.trim()) + '</span> ' : '<span class="gapans no">___</span> ') + '<span class="gapfix">' + esc(v.gaps[p.gap][0]) + '</span>';
        });
        return h + '</div>';
      case 'sort':
        h = '<table class="rtable"><tr><th>Sentence</th><th>Your answer</th><th>Correct</th></tr>';
        q.items.forEach(function (it, ii) {
          var ok = a[ii] === it[1];
          h += '<tr><td>' + esc(it[0]) + '</td><td class="' + (ok ? 'ok' : 'no') + '">' + (a[ii] >= 0 ? esc(q.bins[a[ii]]) : '—') + (ok ? ' ✓' : '') + '</td><td>' + esc(q.bins[it[1]]) + '</td></tr>';
        });
        return h + '</table>';
      case 'order':
        h = '<table class="rtable"><tr><th>#</th><th>Correct order</th><th>Your order</th></tr>';
        q.items.forEach(function (it, p) {
          var ok = a[p] === p;
          h += '<tr><td>' + (p + 1) + '</td><td>' + esc(it) + '</td><td class="' + (ok ? 'ok' : 'no') + '">' + (ok ? '✓' : (a[p] !== undefined ? esc(q.items[a[p]]) : '—')) + '</td></tr>';
        });
        return h + '</table>';
      case 'match':
        h = '<table class="rtable"><tr><th></th><th>Your answer</th><th>Correct</th></tr>';
        q.pairs.forEach(function (pr, pi) {
          var ok = a[pi] === pi;
          h += '<tr><td><b>' + esc(pr[0]) + '</b></td><td class="' + (ok ? 'ok' : 'no') + '">' + (ok ? '✓' : (a[pi] >= 0 ? esc(q.pairs[a[pi]][1]) : '—')) + '</td><td>' + esc(pr[1]) + '</td></tr>';
        });
        return h + '</table>';
      case 'tap': {
        var targets = tapTargets(q, v);
        h = '<div class="rtext">';
        var segs = q.mode === 'word' ? v.tokens.map(function (t) { return t; }) : q.sentences.map(function (s) { return { w: s, after: '' }; });
        segs.forEach(function (s, si) {
          var isT = targets.indexOf(si) >= 0, isP = a.indexOf(si) >= 0;
          var cls = isT && isP ? 'found' : isT ? 'hit' : isP ? 'miss' : '';
          h += (cls ? '<span class="' + cls + '">' + esc(s.w) + '</span>' : esc(s.w)) + esc(s.after) + ' ';
        });
        h += '</div><p class="hint" style="margin:6px 0 0">Green = the correct answer.' + (a.some(function (x) { return targets.indexOf(x) < 0; }) ? ' Crossed out = your answer.' : '') + '</p>';
        return h;
      }
    }
    return '';
  }

  /* ---------------------------------------------------------------- answer key */
  function renderKey() {
    document.title = 'Answer key: ' + quiz.title + ' · W002';
    var html = teacherBar() + bandHTML() + '<main class="quiz-main" style="padding-bottom:40px">' +
      '<p class="label">Answer key</p>' +
      '<p style="margin-top:0"><b>' + esc(W.DAY_NAMES[quiz.day]) + ', cycle week ' + quiz.cycle + '.</b> Starter for Module ' + quiz.module + '. Reviews: ' + esc(quiz.reviews) + '</p>' +
      (quiz.status === 'provisional' ? '<div class="notice-bar"><b>Provisional.</b> ' + esc(quiz.note || 'Check against the finished modules.') + '</div>' : '') +
      '<p class="no-print"><button class="btn small" type="button" onclick="window.print()">Print</button> ' +
      '<button class="btn small" type="button" id="bookqr" title="A permanent QR code for the Starter slide in the book">Download QR for the book</button></p>';
    Q.forEach(function (q, i) {
      html += '<section class="keyq"><div class="qtitle"><p class="label" style="margin:0">Question ' + (i + 1) + '</p><span class="pill">' + TYPE_LABEL[q.type].toUpperCase() + '</span></div>' +
        '<div class="rprompt" style="margin-top:4px">' + esc(q.prompt) + '</div>' +
        (q.context ? '<div class="context" style="margin:6px 0 0">' + esc(q.context) + '</div>' : '') +
        '<div class="ans">' + keyBody(q) + '</div>' +
        '<div class="hint" style="margin:6px 0 0">' + esc(q.explain) + '</div></section>';
    });
    app.innerHTML = html + '</main>';
    var bq = document.getElementById('bookqr');
    if (bq) bq.addEventListener('click', function () {
      var url = new URL(W.PAGE, location.href.split('#')[0].split('?')[0]).href + '?q=' + encodeURIComponent(qid);
      W.download(W.drawQR(document.createElement('canvas'), url, { scale: 16, caption: 'W002 · Module ' + quiz.module + ' starter quiz' }), 'book-qr-' + qid + '.png');
    });
  }
  function keyBody(q) {
    switch (q.type) {
      case 'mc': {
        var c = Array.isArray(q.answer) ? q.answer : [q.answer];
        return '<ul>' + q.options.map(function (o, oi) { return '<li>' + (c.indexOf(oi) >= 0 ? '<b>✓ ' + esc(o) + '</b>' : esc(o)) + '</li>'; }).join('') + '</ul>';
      }
      case 'gap': {
        var g = parseGap(q), h = '';
        g.parts.forEach(function (p) {
          if (p.gap === undefined) h += esc(p.t);
          else { var alts = g.gaps[p.gap]; h += '<b>' + esc(alts[0]) + '</b>' + (alts.length > 1 ? ' <span class="hint">(also: ' + esc(alts.slice(1).join(', ')) + ')</span>' : ''); }
        });
        return h + (q.bank ? '<div class="hint" style="margin:4px 0 0">Word bank: ' + esc(q.bank.join(', ')) + '</div>' : '');
      }
      case 'sort':
        return q.bins.map(function (b, bi) {
          return '<b>' + esc(b) + ':</b> ' + q.items.filter(function (it) { return it[1] === bi; }).map(function (it) { return esc(it[0]); }).join(' · ');
        }).join('<br>');
      case 'order':
        return '<ol>' + q.items.map(function (it) { return '<li>' + esc(it) + '</li>'; }).join('') + '</ol>';
      case 'match':
        return '<ul>' + q.pairs.map(function (p) { return '<li><b>' + esc(p[0]) + '</b> → ' + esc(p[1]) + '</li>'; }).join('') + '</ul>';
      case 'tap': {
        if (q.mode === 'word') {
          return parseWords(q).map(function (t) { return (t.target ? '<b style="background:#2E7D5B;color:#fff;padding:0 3px">' + esc(t.w) + '</b>' : esc(t.w)) + esc(t.after); }).join(' ');
        }
        return q.sentences.map(function (s, si) { return q.answer.indexOf(si) >= 0 ? '<b style="background:#2E7D5B;color:#fff;padding:0 3px">' + esc(s) + '</b>' : esc(s); }).join(' ');
      }
    }
    return '';
  }

  render();
};

/* ===== Start: ?q=... opens a quiz; no ?q opens the hub ===== */
(function () {
  try {
    if (new URLSearchParams(location.search).get('q')) window.W002.run_quiz(); else window.W002.run_hub();
  } catch (e) {
    document.getElementById('app').innerHTML = '<p style="padding:16px">Sorry, something went wrong: ' + String(e && e.message || e).replace(/</g, '&lt;') + '</p>';
    throw e;
  }
})();
</script>
</body>
